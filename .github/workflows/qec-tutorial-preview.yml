name: QEC tutorial preview

on:
  push:
    branches: [main-QECtutorial]

permissions:
  contents: read

concurrency:
  group: qec-tutorial-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'zengzhphy/fatqat' &&
      github.ref == 'refs/heads/main-QECtutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/mkdocs/requirements.txt

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r docs/mkdocs/requirements.txt

      - name: Build and validate the branch preview
        env:
          READTHEDOCS_CANONICAL_URL: ${{ steps.pages.outputs.base_url }}/
          MPLBACKEND: Agg
        run: python -m mkdocs build --strict

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/mkdocs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy branch preview
        id: deployment
        uses: actions/deploy-pages@v4
